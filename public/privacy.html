<!DOCTYPE html>

<html class="dark" lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Privacy Policy - XS-PEDIA API</title>
<link href="https://XS-PEDIA.my.id/files/Q2C70y.png" rel="icon" type="image/png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

<style id="xs-comic-style">
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');
:root{
  --green:#39d353;--green2:#18a841;--deep:#071b10;--ink:#08110b;--cream:#f6ffe9;--yellow:#dfff57;--paper:#efffe6;
  --shadow:5px 5px 0 var(--ink);--shadow-lg:8px 8px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:'Comic Neue','Trebuchet MS',sans-serif!important;color:var(--cream)!important;background:var(--deep)!important;
  background-image:radial-gradient(circle,#58ef6b 1.3px,transparent 1.3px),linear-gradient(135deg,#06140b,#103d18 50%,#06140b)!important;
  background-size:20px 20px,100% 100%!important;background-attachment:fixed!important;
  overflow-x:hidden!important;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,transparent 0 7px,#fff 8px),repeating-linear-gradient(90deg,transparent 0 9px,#fff 10px);mix-blend-mode:soft-light;z-index:0}
h1,h2,h3,h4,.comic-title,.brand-title,.comic-font{font-family:'Bangers','Impact',sans-serif!important;letter-spacing:1.5px!important;text-transform:uppercase!important}
h1{font-size:clamp(2rem,7vw,4rem)!important;text-shadow:3px 3px 0 var(--ink)!important}
h2{font-size:clamp(1.5rem,5vw,2.3rem)!important;text-shadow:2px 2px 0 var(--ink)!important}
p,span,label,input,button,textarea,select,a,li{font-family:'Comic Neue','Trebuchet MS',sans-serif!important}
a{color:var(--green)!important}
button,a,.glass-card,.cyber-panel,.main-card,.qris-frame,.payment-box{border:3px solid var(--ink)!important;box-shadow:var(--shadow)!important}
button,a{transition:transform .12s ease,box-shadow .12s ease!important}
button:active,a:active{transform:translate(3px,3px)!important;box-shadow:2px 2px 0 var(--ink)!important}
input,textarea,select{background:#f9fff3!important;color:#0a180c!important;border:3px solid var(--ink)!important;border-radius:12px!important;box-shadow:3px 3px 0 var(--ink)!important}
input::placeholder,textarea::placeholder{color:#51705a!important}
input:focus,textarea:focus,select:focus{outline:3px solid var(--yellow)!important;border-color:var(--ink)!important;box-shadow:4px 4px 0 var(--ink)!important}
.glass-card,.cyber-panel,.main-card{background:rgba(239,255,230,.96)!important;color:#0a180c!important;backdrop-filter:none!important}
.glass-card *, .cyber-panel *, .main-card *{color:inherit}
.glass-card a,.cyber-panel a,.main-card a{color:var(--green2)!important}
.btn-brutal,.glow-btn-cyan,.glow-btn-purple{background:var(--green)!important;color:var(--ink)!important;background-image:none!important}
.btn-white{background:var(--paper)!important;color:var(--ink)!important}
.badge-ad,.pay-badge{background:var(--yellow)!important;color:var(--ink)!important;border:3px solid var(--ink)!important}
.qris-frame{background:#fff!important}
.custom-alert{background:var(--paper)!important;color:var(--ink)!important;border:3px solid var(--ink)!important}
.top-nav,.wrapper{position:relative;z-index:2}
/* Comic panels */
.comic-panel{position:relative;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:var(--shadow-lg);border-radius:14px;transform:rotate(-.4deg)}
.comic-panel:nth-child(even){transform:rotate(.4deg)}
.speech{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 18px;color:var(--ink);box-shadow:var(--shadow)}
.speech:after{content:'';position:absolute;left:24px;bottom:-16px;border-width:16px 12px 0 0;border-style:solid;border-color:var(--ink) transparent transparent transparent}
.speed-lines{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(135deg,transparent 0 14px,#fff 15px 17px);z-index:-1}
/* Kill any leftovers from the old cyber theme */
.animate-spin,.animate-pulse{animation:none!important}
/* Tailwind cyan/purple/blue visual leftovers -> green comic */
.text-cyan-400,.text-cyan-500,.text-cyan-600,.text-blue-400,.text-purple-400,.text-purple-500,.text-purple-600{color:var(--green)!important}
.bg-cyan-500,.bg-cyan-600,.bg-purple-500,.bg-purple-600{background-color:var(--green)!important}
.border-cyan-500,.border-cyan-400,.border-purple-500{border-color:var(--ink)!important}
.from-cyan-500,.from-cyan-600,.to-cyan-400,.to-cyan-500,.to-purple-400,.to-purple-500,.from-purple-600{--tw-gradient-from:var(--green)!important;--tw-gradient-to:var(--green2)!important}
.from-blue-400,.via-blue-400,.to-blue-500{--tw-gradient-from:var(--green)!important;--tw-gradient-to:var(--green2)!important}
.shadow-2xl{box-shadow:var(--shadow-lg)!important}
@media (max-width:640px){
  .comic-panel{box-shadow:5px 5px 0 var(--ink)}
}
</style></head>
<body class="text-slate-200 font-sans min-h-screen relative overflow-x-hidden antialiased"><div class="speed-lines"></div>

<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-gradient-blur pointer-events-none z-0"></div>
<div class="container max-w-3xl mx-auto px-4 py-12 relative z-10">
<div class="mb-8">
<a class="inline-flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-emerald-500/50 rounded-xl text-slate-300 hover:text-emerald-400 transition-all text-sm font-medium backdrop-blur-md shadow-lg group" href="/docs">
<svg class="w-4 h-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span id="lbl-btn-back">Kembali</span>
</a>
</div>
<header class="mb-10 text-center md:text-left">
<h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-500 mb-2" id="lbl-main-title">
                Kebijakan Privasi
            </h1>
<p class="text-xs font-mono text-emerald-400/80 uppercase tracking-widest" id="lbl-updated">
                Terakhir Diperbarui: 29 Juni 2026
            </p>
</header>
<main class="space-y-6" id="policy-list-container">
<div class="p-6 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-md animate-pulse h-32"></div>
</main>
<footer class="mt-12 pt-8 border-t border-white/15 text-center">
<h3 class="text-sm font-semibold text-slate-300 mb-2" id="lbl-footer-title">Punya pertanyaan atau kendala?</h3>
<p class="text-xs text-slate-400 font-medium" id="lbl-footer-desc">
                Hubungi tim support teknis melalui email resmi kami di: 
                <a class="text-emerald-400 hover:underline font-mono" href="mailto:supportXS-PEDIA@gmail.com">supportXS-PEDIA@gmail.com</a>
</p>
</footer>
</div>
<script>
        const docTranslations = {
            id: {
                btnBack: "Kembali ke Beranda",
                mainTitle: "Kebijakan Privasi",
                updated: "Terakhir Diperbarui: 29 Juni 2026",
                footerTitle: "Punya pertanyaan atau kendala?",
                footerDesc: "Hubungi tim support teknis melalui email resmi kami di:",
                items: [
                    "<strong>1. Pengumpulan Data:</strong> Kami tidak menyimpan data pribadi pengguna di database server kami. Semua data unggahan file yang diproses melalui sistem <a href='/uploader' class='text-emerald-400 hover:underline'>Uploader</a> langsung diteruskan ke penyimpanan terisolasi yang aman dan otomatis dibersihkan secara berkala.",
                    "<strong>2. Penyimpanan Browser:</strong> Kami memanfaatkan fitur media <i>local storage</i> pada aplikasi browser Anda secara aman murni hanya untuk menyimpan konfigurasi preferensi pilihan bahasa utama (ID/EN) serta riwayat autentikasi API Key jika ada.",
                    "<strong>3. Penggunaan Cookie:</strong> Kami sama sekali tidak memasang cookie pelacak pihak ketiga yang mengganggu. Semua aktivitas interaksi ngoding Anda berjalan murni secara efisien dan transparan.",
                    "<strong>4. Transaksi & Dukungan Donasi:</strong> Data pembayaran melalui layanan <a href='/store' class='text-emerald-400 hover:underline'>Store</a> maupun <a href='/support' class='text-emerald-400 hover:underline'>Donasi Support</a> dikelola melalui lisensi gateway resmi dan tidak digunakan untuk keperluan pemasaran ulang yang melanggar hukum.",
                    "<strong>5. Dasar Hukum & Kepatuhan UU PDP:</strong> Pengelolaan sistem XS-PEDIA API tunduk pada ketentuan Undang-Undang Republik Indonesia No. 27 Tahun 2022 tentang Perlindungan Data Pribadi (UU PDP) dan UU ITE untuk menjamin privasi, keamanan digital, serta pemrosesan data yang adil bagi seluruh developer.",
                    "<strong>6. Keamanan Server & Endpoint:</strong> Seluruh komunikasi lalu lintas data dari <a href='/docs' class='text-emerald-400 hover:underline'>Dokumentasi API</a> dilindungi oleh enkripsi SSL/TLS standar industri demi menjaga kerahasiaan payload saat request dikirimkan."
                ]
            },
            en: {
                btnBack: "Back to Home",
                mainTitle: "Privacy Policy",
                updated: "Last Updated: June 29, 2026",
                footerTitle: "Have any questions or concerns?",
                footerDesc: "Contact our technical support team via our official email at:",
                items: [
                    "<strong>1. Data Collection:</strong> We do not store any personal user data on our server databases. All file upload actions processed through the <a href='/uploader' class='text-emerald-400 hover:underline'>Uploader</a> system are directly forwarded to secure, isolated storage and automatically wiped periodically.",
                    "<strong>2. Browser Storage:</strong> We securely use your browser's local storage media to store your preferred language configuration preferences (ID/EN) and local API Key session status.",
                    "<strong>3. Cookie Usage:</strong> We do not deploy intrusive third-party tracking cookies. All your coding interactions run purely in an efficient and transparent manner.",
                    "<strong>4. Store Transactions & Support:</strong> Payment data processed via our <a href='/store' class='text-emerald-400 hover:underline'>Store</a> or <a href='/support' class='text-emerald-400 hover:underline'>Support Donation</a> portals are safely handled via official payment gateways and will never be used for unauthorized remarketing.",
                    "<strong>5. Legal Compliance & PDP Law:</strong> Operations on XS-PEDIA API strictly adhere to Law No. 27 of 2022 concerning Personal Data Protection (UU PDP) and the ITE Law of the Republic of Indonesia to guarantee developer privacy, digital security, and fair processing.",
                    "<strong>6. Server & Endpoint Security:</strong> All traffic from <a href='/docs' class='text-emerald-400 hover:underline'>API Documentation</a> endpoints is encrypted via industry-standard SSL/TLS protocols to ensure payload confidentiality during transmissions."
                ]
            }
        };

        let currentLang = localStorage.getItem('XS-PEDIA_lang') || 'id';

        function renderPrivacyContent() {
            const data = docTranslations[currentLang] || docTranslations['id'];
            
            document.getElementById('lbl-btn-back').innerText = data.btnBack;
            document.getElementById('lbl-main-title').innerText = data.mainTitle;
            document.getElementById('lbl-updated').innerText = data.updated;
            document.getElementById('lbl-footer-title').innerText = data.footerTitle;
            
            document.getElementById('lbl-footer-desc').innerHTML = `${data.footerDesc} <a href="mailto:supportXS-PEDIA@gmail.com" class="text-emerald-400 hover:underline font-mono">supportXS-PEDIA@gmail.com</a>`;

            const listContainer = document.getElementById('policy-list-container');
            listContainer.innerHTML = '';
            
            data.items.forEach(text => {
                const box = document.createElement('div');
                box.className = 'p-6 bg-white/5 border border-white/10 hover:border-emerald-500/30 rounded-2xl backdrop-blur-md transition-all duration-300 text-slate-300 leading-relaxed text-sm md:text-base';
                box.innerHTML = text;
                listContainer.appendChild(box);
            });
        }
        
        </script>
</body>
</html>
